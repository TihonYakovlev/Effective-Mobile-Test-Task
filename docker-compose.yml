services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-auth_demo}
      POSTGRES_USER: ${POSTGRES_USER:-auth_demo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-auth_demo}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
